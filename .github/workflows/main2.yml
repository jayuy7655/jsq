name: main2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v3

      - name: Setup macOS GUI & VNC Server Legacy
        shell: /bin/bash {0}
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate \
            -configure \
            -allowAccessFor -allUsers \
            -privs -all

          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw "123456" \
            -restart -agent -console

      - name: Install Cask Applications (Discord & VSCodium)
        shell: /bin/bash {0}
        run: |
          brew install --cask discord
          brew install --cask vscodium

      - name: Install Tailscale
        shell: /bin/bash {0}
        run: |
          brew install tailscale
          sudo tailscaled &
          sleep 3

      - name: Install and configure keep-alive daemon
        shell: /bin/bash {0}
        run: |
          sudo tee /Library/LaunchDaemons/com.github.keepdisplay.plist > /dev/null << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>Label</key>
              <string>com.github.keepdisplay</string>
              <key>ProgramArguments</key>
              <array>
                  <string>/usr/bin/caffeinate</string>
                  <string>-d</string>
                  <string>-i</string>
                  <string>-m</string>
                  <string>-s</string>
                  <string>-u</string>
                  <string>-t</string>
                  <string>0</string>
              </array>
              <key>RunAtLoad</key>
              <true/>
              <key>KeepAlive</key>
              <true/>
              <key>StandardOutPath</key>
              <string>/tmp/keepdisplay.log</string>
              <key>StandardErrorPath</key>
              <string>/tmp/keepdisplay.err</string>
          </dict>
          </plist>
          PLIST
          sudo chown root:wheel /Library/LaunchDaemons/com.github.keepdisplay.plist
          sudo chmod 644 /Library/LaunchDaemons/com.github.keepdisplay.plist
          sudo launchctl load -w /Library/LaunchDaemons/com.github.keepdisplay.plist
          sleep 2

      - name: Start Tailscale and Keep Alive
        shell: /bin/bash {0}
        run: |
          sudo tailscale up \
            --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" \
            --hostname="gh-mac-runner-$GITHUB_RUN_ID" \
            --accept-dns=false

          tsIP=""
          retries=0
          while [ -z "$tsIP" ] && [ $retries -lt 10 ]; do
            tsIP=$(tailscale ip -4 2>/dev/null)
            sleep 5
            retries=$((retries + 1))
          done

          if [ -z "$tsIP" ]; then
            echo "❌ Tailscale IP not assigned. Exiting."
            exit 1
          fi

          echo ""
          echo "═══════════════════════════════════════════════════"
          echo "  🌐 TAILSCALE CONNECTED (macOS 15)"
          echo "  VNC Address : $tsIP"
          echo "  VNC Password: 123456"
          echo "═══════════════════════════════════════════════════"
          echo ""

          sudo pmset -a disablesleep 1 sleep 0 displaysleep 0 disksleep 0

          echo "[*] Inyectando permisos TCC para ARDAgent, WindowServer y screensharing..."
          sudo tccutil reset ScreenCapture 2>/dev/null || true
          sudo tccutil reset Accessibility 2>/dev/null || true

          TCC_ENTRIES=(
            "'kTCCServiceScreenCapture', '/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/ARDAgent', 1, 2, 4, 1"
            "'kTCCServiceScreenCapture', '/System/Library/CoreServices/RemoteManagement/ARDAgent.app', 1, 2, 4, 1"
            "'kTCCServiceScreenCapture', 'com.apple.WindowServer', 1, 2, 4, 1"
            "'kTCCServiceScreenCapture', 'com.apple.screensharing', 1, 2, 4, 1"
            "'kTCCServiceScreenCapture', '/usr/sbin/screencapture', 1, 2, 4, 1"
            "'kTCCServiceScreenCapture', '/usr/bin/screencapture', 1, 2, 4, 1"
            "'kTCCServiceAccessibility', 'com.apple.screensharing', 1, 2, 4, 1"
            "'kTCCServiceAccessibility', '/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/ARDAgent', 1, 2, 4, 1"
          )
          for entry in "${TCC_ENTRIES[@]}"; do
            sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
              "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version) VALUES (${entry});" 2>/dev/null || true
          done

          echo "[*] Reiniciando ARDAgent para que se asocie a la sesión gráfica de 'runner'..."
          sudo launchctl bootout system/com.apple.RemoteDesktop.agent 2>/dev/null || true
          sleep 2
          sudo launchctl bootstrap system /System/Library/LaunchDaemons/com.apple.RemoteDesktop.agent.plist 2>/dev/null || true
          sleep 5

          echo "[*] Verificando que ARDAgent está escuchando en el puerto 5900..."
          sudo lsof -i :5900 || echo "[-] ADVERTENCIA: El puerto 5900 no está abierto aún."

          echo "[*] Test de captura de pantalla..."
          sudo screencapture -x /tmp/test_capture.png 2>&1 || true
          if [ -f /tmp/test_capture.png ]; then
            echo "[+] Screen capture test OK: $(ls -la /tmp/test_capture.png)"
            echo "[*] Analizando contenido del PNG..."

            cat << 'PY' > /tmp/analyze_capture.py
          from PIL import Image
          try:
              img = Image.open('/tmp/test_capture.png')
              print('Size:', img.size)
              pixels = list(img.getdata())
              n = len(pixels)
              r = sum(p[0] for p in pixels) // n
              g = sum(p[1] for p in pixels) // n
              b = sum(p[2] for p in pixels) // n
              print(f'Average RGB: ({r}, {g}, {b})')
              if r < 20 and g < 20 and b < 20:
                  print('DIAGNOSTICO: Framebuffer NEGRO (vacio o en sleep)')
              elif r > 200 and g > 200 and b > 200:
                  print('DIAGNOSTICO: Framebuffer BLANCO (pantalla de login posible)')
              else:
                  print('DIAGNOSTICO: Framebuffer con CONTENIDO REAL - VNC deberia verse')
          except Exception as e:
              print('Error analizando PNG:', e)
          PY

            sudo python3 /tmp/analyze_capture.py 2>/dev/null || echo "[!] Python/PIL no disponible para analizar"
          else
            echo "[-] Screen capture test failed"
          fi

          echo "[*] Usuario de consola actual:"
          stat -f "%Su" /dev/console || true

          echo "[*] Procesos de ARDAgent:"
          ps aux | grep -i ARDAgent | grep -v grep || true

          echo ""
          echo "✅ Listo. Conéctate a $tsIP:5900 con la contraseña 123456"
          echo ""

          while true; do
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] ⏳ Sesión activa — macOS GUI lista"
            sleep 300
          done
