name: main2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v3

      - name: Setup macOS VNC Server (legacy native)
        shell: /bin/bash {0}
        run: |
          echo "[*] Creando usuario vncuser..."
          sudo dscl . -create /Users/vncuser
          sudo dscl . -create /Users/vncuser UserShell /bin/bash
          sudo dscl . -create /Users/vncuser RealName "VNC User"
          sudo dscl . -create /Users/vncuser UniqueID 502
          sudo dscl . -create /Users/vncuser PrimaryGroupID 20
          sudo dscl . -create /Users/vncuser NFSHomeDirectory /Users/vncuser
          sudo dscl . -passwd /Users/vncuser "123456"
          sudo dscl . -append /Groups/admin GroupMembership vncuser

          echo "[*] Habilitando servidor VNC nativo legacy..."
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate \
            -configure \
            -allowAccessFor -allUsers \
            -privs -all

          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw "123456" \
            -restart -agent -console

          echo "[*] Habilitando pantalla compartida a nivel de sistema..."
          sudo launchctl enable system/com.apple.screensharing 2>/dev/null || true
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true

      - name: Install Cask Applications (Discord & VSCodium)
        shell: /bin/bash {0}
        run: |
          brew install --cask discord
          brew install --cask vscodium

      - name: Install Tailscale
        shell: /bin/bash {0}
        run: |
          brew install tailscale
          sudo tailscaled &
          sleep 3

      - name: Install and configure keep-alive daemon
        shell: /bin/bash {0}
        run: |
          sudo tee /Library/LaunchDaemons/com.github.keepdisplay.plist > /dev/null << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>Label</key>
              <string>com.github.keepdisplay</string>
              <key>ProgramArguments</key>
              <array>
                  <string>/usr/bin/caffeinate</string>
                  <string>-d</string>
                  <string>-i</string>
                  <string>-m</string>
                  <string>-s</string>
                  <string>-u</string>
                  <string>-t</string>
                  <string>0</string>
              </array>
              <key>RunAtLoad</key>
              <true/>
              <key>KeepAlive</key>
              <true/>
              <key>StandardOutPath</key>
              <string>/tmp/keepdisplay.log</string>
              <key>StandardErrorPath</key>
              <string>/tmp/keepdisplay.err</string>
          </dict>
          </plist>
          PLIST
          sudo chown root:wheel /Library/LaunchDaemons/com.github.keepdisplay.plist
          sudo chmod 644 /Library/LaunchDaemons/com.github.keepdisplay.plist
          sudo launchctl load -w /Library/LaunchDaemons/com.github.keepdisplay.plist
          sleep 2

      - name: Start Tailscale + VNC and Keep Alive
        shell: /bin/bash {0}
        run: |
          sudo tailscale up \
            --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" \
            --hostname="gh-mac-runner-$GITHUB_RUN_ID" \
            --accept-dns=false

          tsIP=""
          retries=0
          while [ -z "$tsIP" ] && [ $retries -lt 10 ]; do
            tsIP=$(tailscale ip -4 2>/dev/null)
            sleep 5
            retries=$((retries + 1))
          done

          if [ -z "$tsIP" ]; then
            echo "❌ Tailscale IP not assigned. Exiting."
            exit 1
          fi

          echo ""
          echo "═══════════════════════════════════════════════════"
          echo "  🌐 TAILSCALE + VNC NATIVO (macOS 15)"
          echo "  VNC Address : $tsIP:5900"
          echo "  VNC Password: 123456"
          echo "  Usuario     : vncuser"
          echo "  Password Sys: 123456"
          echo "═══════════════════════════════════════════════════"
          echo ""

          sudo pmset -a disablesleep 1 sleep 0 displaysleep 0 disksleep 0

          echo "[*] Verificando que el puerto 5900 está escuchando..."
          sleep 5
          sudo lsof -i :5900 || echo "[-] ADVERTENCIA: El puerto 5900 no está abierto."

          echo "[*] Usuario de consola actual:"
          stat -f "%Su" /dev/console || true

          echo "[*] Test de captura nativo..."
          sudo screencapture -x /tmp/test_capture.png 2>&1 || true
          if [ -f /tmp/test_capture.png ]; then
            echo "[+] Screen capture test OK: $(ls -la /tmp/test_capture.png)"
          else
            echo "[-] Screen capture test failed"
          fi

          echo ""
          echo "✅ Listo. Conéctate a $tsIP:5900 con la contraseña 123456"
          echo ""

          while true; do
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] ⏳ Sesión activa — VNC listo en $tsIP:5900"
            sleep 300
          done
