name: main2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v3

      - name: Setup macOS GUI & VNC Server Legacy
        run: |
          sudo dscl . -create /Users/vncuser
          sudo dscl . -create /Users/vncuser UserShell /bin/bash
          sudo dscl . -create /Users/vncuser RealName "VNC User"
          sudo dscl . -create /Users/vncuser UniqueID 502
          sudo dscl . -create /Users/vncuser PrimaryGroupID 20
          sudo dscl . -create /Users/vncuser NFSHomeDirectory /Users/vncuser
          sudo dscl . -passwd /Users/vncuser "123456"
          sudo dscl . -append /Groups/admin GroupMembership vncuser
          
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate \
            -configure \
            -allowAccessFor -allUsers \
            -privs -all
          
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw "123456" \
            -restart -agent

      - name: Install Cask Applications (Discord & VSCodium)
        run: |
          brew install --cask discord
          brew install --cask vscodium

      - name: Install Tailscale
        run: |
          brew install tailscale
          sudo tailscaled &
          sleep 3

      - name: Start Tailscale + sshx and Keep Alive
        run: |
          sudo tailscale up \
            --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" \
            --hostname="gh-mac-runner-$GITHUB_RUN_ID" \
            --accept-dns=false

          tsIP=""
          retries=0
          while [ -z "$tsIP" ] && [ $retries -lt 10 ]; do
            tsIP=$(tailscale ip -4 2>/dev/null)
            sleep 5
            retries=$((retries + 1))
          done

          if [ -z "$tsIP" ]; then
            echo "❌ Tailscale IP not assigned. Exiting."
            exit 1
          fi

          echo ""
          echo "═══════════════════════════════════════════════════"
          echo "  🌐 TAILSCALE CONNECTED (macOS-26)"
          echo "  VNC Address : $tsIP"
          echo "  VNC Password: 123456"
          echo "═══════════════════════════════════════════════════"
          echo ""

          # 🌟 WAKE HEADLESS SCREEN: Disable UI screen sleeping and stimulate system events
          sudo defaults write /Library/Preferences/com.apple.PowerManagement.plist "Custom Profile" -dict-add "Display Sleep Timer" 0
          sudo defaults write /Library/Preferences/com.apple.PowerManagement.plist "Custom Profile" -dict-add "System Sleep Timer" 0
          sudo caffeinate -u -t 5 &
          
          # Force UI presentation shell loop invocation
          sudo osascript -e 'tell application "System Events" to key code 123' || true

          # Correct sshx direct pipeline injection link
          curl -sSfL https://sshx.io | sh -s run &
          sleep 5

          while true; do
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] ⏳ Session active — macOS GUI ready"
            sleep 300
          done
