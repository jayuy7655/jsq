name: main2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v3

      - name: Setup VNC legacy
        shell: /bin/bash {0}
        run: |
          sudo dscl . -create /Users/vncuser
          sudo dscl . -create /Users/vncuser UserShell /bin/bash
          sudo dscl . -create /Users/vncuser RealName "VNC User"
          sudo dscl . -create /Users/vncuser UniqueID 502
          sudo dscl . -create /Users/vncuser PrimaryGroupID 20
          sudo dscl . -create /Users/vncuser NFSHomeDirectory /Users/vncuser
          sudo dscl . -passwd /Users/vncuser "123456"
          sudo dscl . -append /Groups/admin GroupMembership vncuser

          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -allowAccessFor -allUsers -privs -all
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw "123456" -restart -agent -console

      - name: Install Tailscale
        shell: /bin/bash {0}
        run: |
          brew install tailscale
          sudo tailscaled &
          sleep 3

      - name: Install BetterDisplay + CLI
        shell: /bin/bash {0}
        run: |
          brew install --cask betterdisplay
          brew install waydabber/betterdisplay/betterdisplaycli

      - name: Keep-alive daemon
        shell: /bin/bash {0}
        run: |
          sudo tee /Library/LaunchDaemons/com.github.keepdisplay.plist > /dev/null << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>Label</key><string>com.github.keepdisplay</string>
              <key>ProgramArguments</key>
              <array>
                  <string>/usr/bin/caffeinate</string>
                  <string>-d</string><string>-i</string><string>-m</string>
                  <string>-s</string><string>-u</string><string>-t</string><string>0</string>
              </array>
              <key>RunAtLoad</key><true/>
              <key>KeepAlive</key><true/>
              <key>StandardOutPath</key><string>/tmp/keepdisplay.log</string>
              <key>StandardErrorPath</key><string>/tmp/keepdisplay.err</string>
          </dict>
          </plist>
          PLIST
          sudo chown root:wheel /Library/LaunchDaemons/com.github.keepdisplay.plist
          sudo chmod 644 /Library/LaunchDaemons/com.github.keepdisplay.plist
          sudo launchctl load -w /Library/LaunchDaemons/com.github.keepdisplay.plist
          sleep 2

      - name: Start Tailscale + VNC + Virtual Display
        shell: /bin/bash {0}
        run: |
          sudo tailscale up \
            --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" \
            --hostname="gh-mac-runner-$GITHUB_RUN_ID" \
            --accept-dns=false

          tsIP=""
          retries=0
          while [ -z "$tsIP" ] && [ $retries -lt 10 ]; do
            tsIP=$(tailscale ip -4 2>/dev/null)
            sleep 5
            retries=$((retries + 1))
          done
          [ -z "$tsIP" ] && { echo "❌ Tailscale IP not assigned."; exit 1; }

          echo ""
          echo "═══════════════════════════════════════════════════"
          echo "  🌐 TAILSCALE + VNC + VIRTUAL DISPLAY (macOS 15)"
          echo "  VNC Address : $tsIP:5900"
          echo "  VNC Password: 123456"
          echo "═══════════════════════════════════════════════════"
          echo ""

          sudo pmset -a disablesleep 1 sleep 0 displaysleep 0 disksleep 0
          sudo tccutil reset ScreenCapture 2>/dev/null || true
          sudo tccutil reset Accessibility 2>/dev/null || true

          echo "[*] Lanzando BetterDisplay en segundo plano..."
          open -a BetterDisplay --args --headless
          sleep 8

          echo "[*] Habilitando CLI access en BetterDisplay..."
          defaults write com.waydabber.BetterDisplay CLIEnabled -bool true
          sleep 2

          echo "[*] Creando display virtual con betterdisplaycli..."
          betterdisplaycli create -devicetype=virtualscreen -virtualscreenname=GitHubVNC -aspectWidth=16 -aspectHeight=9 -resolution=1920x1080 || echo "[-] betterdisplaycli create falló"
          sleep 5

          echo "[*] Conectando el display virtual..."
          betterdisplaycli set -namelike=GitHubVNC -connected=on || echo "[-] betterdisplaycli set falló"
          sleep 5

          echo "[*] Displays después de BetterDisplay:"
          system_profiler SPDisplaysDataType 2>/dev/null | head -60 || true

          echo "[*] Inyectando TCC para ARDAgent y screensharing..."
          TCC_ENTRIES=(
            "'kTCCServiceScreenCapture', '/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/ARDAgent', 1, 2, 4, 1"
            "'kTCCServiceScreenCapture', 'com.apple.WindowServer', 1, 2, 4, 1"
            "'kTCCServiceScreenCapture', 'com.apple.screensharing', 1, 2, 4, 1"
            "'kTCCServiceScreenCapture', '/usr/sbin/screencapture', 1, 2, 4, 1"
            "'kTCCServiceScreenCapture', '/usr/bin/screencapture', 1, 2, 4, 1"
            "'kTCCServiceAccessibility', 'com.apple.screensharing', 1, 2, 4, 1"
          )
          for entry in "${TCC_ENTRIES[@]}"; do
            sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
              "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version) VALUES (${entry});" 2>/dev/null || true
          done

          echo "[*] Reiniciando screensharing a nivel de sistema..."
          sudo launchctl bootout system/com.apple.screensharing 2>/dev/null || true
          sleep 2
          sudo launchctl bootstrap system /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true
          sleep 5

          echo "[*] Puerto 5900:"
          sudo lsof -i :5900 || echo "[-] Puerto 5900 no abierto"

          echo "[*] Test de captura:"
          sudo screencapture -x /tmp/test_capture.png 2>&1 || true
          ls -la /tmp/test_capture.png 2>/dev/null || echo "[-] No PNG"

          echo ""
          echo "✅ Listo. Conéctate a $tsIP:5900 con contraseña 123456"
          echo ""

          while true; do
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] ⏳ Sesión activa"
            sleep 300
          done
