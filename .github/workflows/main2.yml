name: main

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v3

      - name: Setup macOS GUI & VNC Server
        run: |
          sudo dscl . -passwd /Users/runner 123456
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist

      - name: Install Cask Applications (Discord & VSCodium)
        run: |
          brew install --cask discord
          brew install --cask vscodium

      - name: Install Tailscale
        run: |
          brew install tailscale
          sudo tailscaled &
          sleep 3

      - name: Start Tailscale + sshx and Launch iPhone Simulator
        run: |
          sudo tailscale up \
            --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" \
            --hostname="gh-mac-runner-$GITHUB_RUN_ID" \
            --accept-dns=false

          tsIP=""
          retries=0
          while [ -z "$tsIP" ] && [ $retries -lt 10 ]; do
            tsIP=$(tailscale ip -4 2>/dev/null)
            sleep 5
            retries=$((retries + 1))
          done

          if [ -z "$tsIP" ]; then
            echo "❌ Tailscale IP not assigned. Exiting."
            exit 1
          fi

          open -a Simulator
          sleep 10 

          echo ""
          echo "═══════════════════════════════════════════════════"
          echo "  🌐 TAILSCALE CONNECTED (macOS-26)"
          echo "  VNC Address : $tsIP"
          echo "  Username    : runner"
          echo "  Password    : 123456"
          echo "═══════════════════════════════════════════════════"
          echo ""

          curl -sSf https://sshx.io | sh
          sshx &
          sleep 3

          while true; do
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] ⏳ Session active — macOS GUI & iPhone Simulator ready"
            sleep 300
          done
