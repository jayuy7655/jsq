name: main

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v3

      - name: Update package list
        run: sudo apt-get update

      - name: Install Xfce and dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive \
          apt install --assume-yes xfce4 desktop-base dbus-x11 xscreensaver curl gnupg ca-certificates

      - name: Configure Chrome Remote Desktop session
        run: |
          sudo bash -c 'echo "exec /etc/X11/Xsession /usr/bin/xfce4-session" > /etc/chrome-remote-desktop-session'

      - name: Add Google APT repository for Chrome Remote Desktop
        run: |
          sudo install -d -m 0755 /usr/share/keyrings
          curl -fsSL https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google-linux.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-linux.gpg] https://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list > /dev/null
          sudo apt-get update

      - name: Install Chrome Remote Desktop host
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --assume-yes chrome-remote-desktop

      - name: Download and install Discord
        run: |
          wget -O discord.deb "https://discord.com/api/download?platform=linux&format=deb"
          sudo apt install ./discord.deb -y
          rm discord.deb

      - name: Run sshx
        run: curl -sSf https://sshx.io/get | sh -s run
