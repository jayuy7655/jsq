name: main

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v3

      - name: Update package list
        run: sudo apt-get update

      - name: Install Xfce4 and dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive           apt install --assume-yes xfce4 desktop-base dbus-x11 xscreensaver curl gnupg ca-certificates netcat-openbsd

      - name: Download and install Discord
        run: |
          wget -O discord.deb "https://discord.com/api/download?platform=linux&format=deb"
          sudo apt install ./discord.deb -y
          rm discord.deb

      - name: Install VS Codium
        run: |
          wget -qO - https://gitlab.com/paulcarroty/vscodium-deb-rpm-repo/raw/master/pub.gpg             | gpg --dearmor             | sudo dd of=/usr/share/keyrings/vscodium-archive-keyring.gpg
          echo 'deb [ signed-by=/usr/share/keyrings/vscodium-archive-keyring.gpg ] https://download.vscodium.com/debs vscodium main'             | sudo tee /etc/apt/sources.list.d/vscodium.list
          sudo apt-get update
          sudo apt-get install -y codium

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Start Tailscale + sshx and Keep Alive
        run: |
          # ── 1. Levantar Tailscale ──────────────────────────────────────
          sudo tailscale up             --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}"             --hostname="gh-runner-$GITHUB_RUN_ID"             --accept-dns=false

          # Esperar IP
          tsIP=""
          retries=0
          while [ -z "$tsIP" ] && [ $retries -lt 10 ]; do
            tsIP=$(tailscale ip -4 2>/dev/null)
            sleep 5
            retries=$((retries + 1))
          done

          if [ -z "$tsIP" ]; then
            echo "❌ Tailscale IP not assigned. Exiting."
            exit 1
          fi

          echo ""
          echo "═══════════════════════════════════════════════════"
          echo "  🌐 TAILSCALE CONNECTED"
          echo "  Address : $tsIP"
          echo "  SSH User: runner"
          echo "  Command : ssh runner@$tsIP"
          echo "═══════════════════════════════════════════════════"
          echo ""

          # ── 2. Instalar y lanzar sshx ──────────────────────────────────
          curl -sSf https://sshx.io/get | sh
          echo ""
          echo "🚀 Starting sshx session..."
          sshx &
          SSHX_PID=$!
          sleep 3

          # ── 3. Mostrar resumen final ───────────────────────────────────
          echo ""
          echo "═══════════════════════════════════════════════════"
          echo "  ✅ SESSION ACTIVE — DO NOT CANCEL THIS STEP"
          echo "═══════════════════════════════════════════════════"
          echo "  🌐 Tailscale IP : $tsIP"
          echo "  👤 SSH User     : runner"
          echo "  🔗 sshx URL     : (see output above ↑)"
          echo "═══════════════════════════════════════════════════"
          echo ""

          # ── 4. Mantener vivo el runner ─────────────────────────────────
          while true; do
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] ⏳ Session active — Tailscale: $tsIP | sshx running"
            sleep 300
          done
