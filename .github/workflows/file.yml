name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2025
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Ngrok"
          netsh advfirewall firewall add rule name="RDP-Ngrok" `
            dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        run: |
          Add-Type -AssemblyName System.Security
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) +
                         [char[]](91..96) + [char[]](123..126))
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

          echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

          if (-not (Get-LocalUser -Name "RDP")) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Install ngrok
        run: |
          $ngrokUrl = "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip"
          $zipPath = "$env:TEMP\ngrok.zip"
          $extractPath = "C:\ngrok"

          Invoke-WebRequest -Uri $ngrokUrl -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force
          Remove-Item $zipPath -Force

          echo "C:\ngrok" >> $env:GITHUB_PATH
          & "$extractPath\ngrok.exe" config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

      - name: Establish ngrok Tunnel
        run: |
          Start-Process -FilePath "C:\ngrok\ngrok.exe" `
            -ArgumentList "tcp", "3389", "--log=stdout", "--log-format=json" `
            -RedirectStandardOutput "$env:TEMP\ngrok.log" `
            -RedirectStandardError "$env:TEMP\ngrok.err" `
            -NoNewWindow

          $ngrokUrl = $null
          $retries = 0
          while (-not $ngrokUrl -and $retries -lt 20) {
              Start-Sleep -Seconds 3
              try {
                  $api = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels" -ErrorAction Stop
                  $ngrokUrl = ($api.tunnels | Where-Object { $_.proto -eq "tcp" } | Select-Object -First 1).public_url
              } catch { }
              $retries++
          }

          if (-not $ngrokUrl) {
              Write-Error "No se pudo obtener la URL de ngrok"
              Get-Content "$env:TEMP\ngrok.log" -ErrorAction SilentlyContinue
              Get-Content "$env:TEMP\ngrok.err" -ErrorAction SilentlyContinue
              exit 1
          }

          echo "NGROK_URL=$ngrokUrl" >> $env:GITHUB_ENV
          Write-Host "ngrok URL: $ngrokUrl"

      - name: Verify RDP Accessibility
        run: |
          $uri = [System.Uri]$env:NGROK_URL
          $testResult = Test-NetConnection -ComputerName $uri.Host -Port $uri.Port
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection
        run: |
          $uri = [System.Uri]$env:NGROK_URL

          Write-Host "`n==========================================="
          Write-Host " RDP ACCESS"
          Write-Host "==========================================="
          Write-Host " Server   : $($uri.Host):$($uri.Port)"
          Write-Host " Username : RDP"
          Write-Host " Password : $env:RDP_PASSWORD"
          Write-Host "===========================================`n"

          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Cancela el workflow para terminar"
              Start-Sleep -Seconds 300
          }
